[package]
name = "sard"
version = "1.3.0"
description = "Sard (سَرْد) — a beautiful ebook reader"
authors = ["Sard"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# THE ONLY SWITCH BETWEEN A RELEASE BUILD AND A DIAGNOSTIC ONE.
#
# `diag` is OFF by default, so every ordinary `cargo build`, every `tauri build`, and every CI run
# produces a release binary that has never compiled a line of instrumentation. Turning it on is an
# explicit act (`--features diag`, which only the diagnostic packaging step performs), and it changes the app's
# name, executable, identifier and version through `tauri.diag.conf.json` at the same time — the two
# cannot be turned on separately, which is what makes a mislabelled build unbuildable rather than
# merely discouraged. See scripts/build-identity.mjs for why this exists.
[features]
default = []
diag = []
# Compiles `books::corpus_tests`, whose source ships only with the private workspace because the book
# corpus it reads is not distributed. Off by default so a tree without that file still builds its
# test target; the workspace that has it runs `cargo test --features corpus-tests`.
corpus-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RAWY-178 (AUD-12): `functions` enables `create_scalar_function` for the `afold` Arabic search fold
# (a rusqlite feature — no new external crate; the bundled SQLite already supports app functions).
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
# Import pipeline (RAWY-17): unzip EPUBs, hash for a stable id, parse the OPF.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
quick-xml = "0.36"
# RAWY-265 (backgrounds): decode + Lanczos3 downscale + LOSSLESS PNG encode for the render-ceiling
# derivative, and EXIF-orientation resolution. `default-features = false` keeps the tree to exactly the
# three formats the spec accepts — notably NO `gif`, so an animated GIF cannot even be decoded here
# (it is refused by magic-byte sniff long before that). MIT/Apache-2.0, permissive, consistent with D3.
# `gif` is here for COVER VALIDATION only, not for backgrounds: a decoder is what lets Sard say
# "this file is damaged" instead of storing something that will never render. It is pure Rust, so it
# adds no external dependency and no cross-platform build cost. Formats this cannot decode are NOT
# rejected — they fall through to the renderer, which is the only validator whose answer means
# "this will display" (see library::stage_cover).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# TTS engine #2 (RAWY-111): the FREE, keyless Edge "Read Aloud" neural voices (edge-tts protocol) —
# the Arabic-quality path. Blocking client (ureq + tungstenite + rustls), MIT, whole tree permissive.
msedge-tts = "0.4"
# RAWY-111: msedge-tts (aws-lc-rs) + ureq 3 (ring) compile TWO rustls crypto providers into one
# rustls, so `ClientConfig::builder()`'s auto-detection is ambiguous and PANICS (hanging the Edge WS
# connect). We install aws-lc-rs as the explicit process default at startup to disambiguate.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# READING-STATE SYNC: the HTTP client the account backend speaks Supabase with. It is NOT a new
# dependency in any real sense — the tree already compiles ureq 3 through `msedge-tts`, at this exact
# version and with its default features (`rustls`, `gzip`), so Cargo.lock does not move. Naming it here
# only makes explicit what was already being linked, and keeps the sync code from reaching into another
# crate's transitive dependency. `rustls` here means the webpki root store, which works on Android
# without a platform verifier.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(target_os = "android")'.dependencies]
# Read document-picker content URIs through Android's ContentResolver, never as filesystem paths.
tauri-plugin-fs = "2.5.1"
percent-encoding = "2"

# DESKTOP-ONLY PLUGINS. All three are unavailable on Android and iOS, and one of them does not merely
# fail at run time — it fails to COMPILE:
#
#   single-instance   `src/lib.rs` opens with `#![cfg(not(any(target_os = "android", target_os =
#                     "ios")))]`, a CRATE-level attribute. On mobile the crate compiles to nothing, so
#                     `tauri_plugin_single_instance::init` does not exist and the call site is an
#                     unresolved path. This is the hard blocker.
#   updater           Compiles on mobile but declares `platforms.support.{android,ios}.level =
#   process           "none"`, and both stores forbid an application updating itself outside the
#                     store. The plugin's own README states the rule this section follows: "you can
#                     add the dependencies on the `[dependencies]` section if you do not target
#                     mobile". `process` travels with it because it exists to serve the updater flow.
#
# WHY A `target` SECTION AND NOT `cfg(desktop)`. Tauri's `desktop`/`mobile` aliases are emitted by
# tauri-build at COMPILE time (tauri-build/src/lib.rs), so Cargo — which resolves dependencies before
# any build script runs — cannot see them. Dependency gating has to use a built-in cfg; the call
# sites in `lib.rs` use `cfg(desktop)`, which is the same set expressed where the alias does exist.
#
# Desktop resolution is unchanged: on Windows, macOS and Linux this predicate is true, so the three
# crates are still ordinary dependencies and `Cargo.lock` does not move.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# RAWY-173 (AUD-9): a second launch focuses the existing window instead of starting a rival instance
# that would attach the same WAL DB + fight over per-session state.
tauri-plugin-single-instance = "2"
# The OFFICIAL in-app updater: fetches a signed manifest from GitHub Releases, verifies the
# minisign signature against the public key in tauri.conf.json, then runs the NSIS installer with
# `/UPDATE`. It replaces the hand-rolled check-only path this project carried before — one update
# system, not two.
tauri-plugin-updater = "2"
# `relaunch()` after an install. On Windows the NSIS installer restarts Sard itself (the plugin
# passes `/ARGS`), so this is belt-and-braces there — but it is the documented path on macOS and
# Linux, and having it means the frontend has one restart call that is correct everywhere.
tauri-plugin-process = "2"
# Discord Rich Presence (PR: disc/rpc): what the user is reading, shown on their Discord profile.
# v1.x is a from-scratch rewrite that speaks Discord's IPC protocol directly — no GameSDK, no
# bundled DLL, and no build-time download (the old discord-sdk path fetched a binary from Discord).
# Same client id + asset keys as any Discord application; the id lives in src/presence.rs, one
# constant, because it must be supplied by the app owner (see the comment there). MIT.
discord-rich-presence = "1.1"

# RAWY-196: reach WebView2's own settings to strip the browser chrome (find bar, reload, print,
# context menu). Tauri exposes none of these, so they are set through `with_webview` -> the WebView2
# controller. Both crates are ALREADY in the tree via tauri/wry — pinned to those exact versions so
# cargo dedupes to one copy and the COM interfaces stay ABI-identical to the ones wry hands us.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# RAWY-270A adds the Core Audio features. `Win32_Foundation`, `Win32_System_Com` and
# `Win32_System_Variant` already arrive through webview2-com, but they are named here too: feature
# unification makes them present either way, and depending on another crate's feature list silently
# is how a build breaks when that crate is bumped.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",                    # IMMDeviceEnumerator, IAudioSessionControl2, the notifications
    "Win32_System_Diagnostics_ToolHelp",    # the process snapshot the ancestry filter walks
    "Win32_System_Threading",               # the event the worker blocks on, GetCurrentProcessId
    "Win32_Security",                       # SECURITY_ATTRIBUTES, which gates CreateEventW
] }
# The `#[implement]` macro expands to `windows_core::` paths resolved at the CRATE root, so the crate
# has to be nameable here even though we reach the same types through `windows::core`. Pinned to the
# version `windows 0.61` re-exports (and the one webview2-com already declares) so there is exactly
# one copy and the COM vtables stay ABI-identical.
windows-core = "0.61"

# The sync account's refresh token must NOT live in `sard.db`. Sard's own file is copied, backed up and
# moved between machines, and its promise is that the reader's data is theirs and carries nothing they
# did not put there. The OS credential store is where a secret belongs, and it is the only place this
# one goes: if the store is unavailable the feature refuses to save rather than falling back to
# plaintext.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.keyring]
version = "4"
default-features = false
features = ["v1", "windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"]

# ANDROID, WHERE THE STORE IS REACHED DIFFERENTLY.
#
# The `v1` mode above auto-selects a store for the desktop platforms it knows; Android is not one of
# them, and this is where the phone's own store lives — SharedPreferences encrypted with a key the
# Android keystore holds, reached over JNI. It needs NO Kotlin bridge: the store crate talks to the
# platform itself, which is why the session can be remembered on the phone after all.
#
# `keyring-core` is what the store registers with, and its `Entry` is the type this crate uses there —
# the same two calls (set the store, read or write an entry) as the desktop path, spelled the way the
# keyring ecosystem spells them on mobile.
[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
